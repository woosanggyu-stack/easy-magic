<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쉬운 카드마술 배우기</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7a3cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="마술 배우기">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1d1b26;--mute:#6b6878;--accent:#7a3cff;--gold:#f2a900;--line:#e4dfd6;--back:#3b4cca;--backin:#8fa0ff;--felt:#eae4f7}
@media (prefers-color-scheme:dark){:root{--bg:#14121c;--card:#201d2c;--ink:#f2eff8;--mute:#a29db3;--accent:#a98bff;--line:#322e42;--felt:#2a2540}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Malgun Gothic",sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.6rem;margin:8px 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.tile{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;cursor:pointer;color:inherit;font:inherit}
.tile:hover{border-color:var(--accent)}
.tile h2{margin:0 0 4px;font-size:1.15rem}
.tile p{margin:0;color:var(--mute)}
.tag{display:inline-block;font-size:.78rem;padding:2px 8px;border-radius:99px;background:var(--felt);margin:8px 6px 0 0}
.done{color:#1a9a55;font-weight:600}
.back{background:none;border:none;color:var(--accent);font:inherit;cursor:pointer;padding:4px 0;margin-bottom:6px}
.stage{background:var(--felt);border-radius:14px;padding:8px}
svg{width:100%;height:auto;display:block}
.cf{fill:#fff;stroke:#555;stroke-width:1.2}
.cb{fill:var(--back);stroke:#222;stroke-width:1.2}
.cbi{fill:none;stroke:var(--backin);stroke-width:1.5}
.hi{stroke:var(--gold);stroke-width:3.5}
.ct{font:700 15px system-ui;fill:#222}.ct.red{fill:#d12b3a}
.lb{font:600 12px system-ui,"Malgun Gothic";fill:var(--ink)}
.lb.m{fill:var(--mute);font-weight:400}
.ar{stroke:var(--accent);stroke-width:3;fill:none;stroke-linecap:round}
.arh{fill:var(--accent)}
.step h2{font-size:1.2rem;margin:16px 0 4px}
.step p{margin:4px 0}
.say{background:var(--card);border-left:4px solid var(--accent);padding:8px 12px;border-radius:6px;margin:12px 0;color:var(--mute)}
.nav{display:flex;gap:10px;margin-top:16px}
button.b{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
button.b.p{background:var(--accent);color:#fff;border-color:var(--accent)}
button.b:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}.dot.on{background:var(--accent)}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:14px}
.box h3{margin:0 0 4px;font-size:1rem}
.box ul{margin:4px 0;padding-left:20px}
.box p{margin:4px 0}
.foot{margin-top:24px;text-align:center}
.foot a{color:var(--accent);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;font:inherit;font-size:.9rem;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.hint{color:var(--mute);font-size:.85rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ---------- SVG 그림 도우미 ---------- */
const W=44,H=62;
function card(x,y,o={}){
  const t=o.rot!==undefined?` transform="rotate(${o.rot} ${o.px??x+W/2} ${o.py??y+H/2})"`:'';
  let s=`<g${t}>`;
  if(o.face){
    const red=/[♥♦]/.test(o.face);
    s+=`<rect x="${x}" y="${y}" width="${W}" height="${H}" rx="5" class="cf${o.hi?' hi':''}"/><text x="${x+W/2}" y="${y+H/2+6}" text-anchor="middle" class="ct${red?' red':''}">${o.face}</text>`;
  }else{
    s+=`<rect x="${x}" y="${y}" width="${W}" height="${H}" rx="5" class="cb${o.hi?' hi':''}"/><rect x="${x+6}" y="${y+6}" width="${W-12}" height="${H-12}" rx="3" class="cbi"/>`;
  }
  return s+'</g>';
}
/* 겹쳐진 카드 더미: 마지막(맨 아래 그려진) 카드는 hiLast 로 강조 */
function pile(x,y,n,dy,o={}){let s='';for(let i=0;i<n;i++)s+=card(x,y+i*dy,{hi:o.all||(o.hiIdx===i)});return s}
const text=(x,y,t,cls='lb',a='middle')=>`<text x="${x}" y="${y}" text-anchor="${a}" class="${cls}">${t}</text>`;
function arrow(x1,y1,x2,y2){
  const a=Math.atan2(y2-y1,x2-x1),l=10,p=d=>`${x2-l*Math.cos(a+d)},${y2-l*Math.sin(a+d)}`;
  return `<path class="ar" d="M${x1} ${y1} L${x2} ${y2}"/><path class="arh" d="M${x2} ${y2} L${p(.45)} L${p(-.45)} Z"/>`;
}
const svg=b=>`<svg viewBox="0 0 320 210" role="img">${b}</svg>`;

/* ---------- 마술 데이터 ---------- */
const TRICKS=[
{
 id:'21',title:'21장 카드 마술',level:'★☆☆ 아주 쉬움',time:'약 3분',
 desc:'관객이 마음속으로 고른 카드를 세 번의 줄 세우기만으로 맞혀요. 연습 없이 바로 되는 자동 마술.',
 need:'카드 21장 (아무 카드나 가능)',
 why:'고른 줄을 매번 가운데에 끼우면 고른 카드가 점점 한가운데로 모입니다. 세 번 반복하면 정확히 위에서 11번째에 고정돼요.',
 tips:['한 장씩 같은 속도로, 줄 순서가 헷갈리지 않게 천천히 깔아요.','"어느 줄이에요?"만 묻고 카드 내용은 절대 보지 마세요.','마지막에 한 장씩 넘기다 11번째에서 멈칫하면 연출 효과가 두 배!'],
 steps:[
  {t:'카드 21장 보여주기',x:'아무 카드 21장을 부채처럼 펼쳐 보여주세요. 관객은 한 장을 속으로만 기억합니다. 말하거나 만지지 않아요.',say:'"마음에 드는 카드 한 장만 머릿속에 담아 보세요. 말하면 안 돼요!"',
   svg:svg(Array.from({length:7},(_,i)=>card(138,40,{rot:-36+i*12,px:160,py:175,hi:i===3})).join('')+text(160,22,'관객이 한 장을 속으로 기억','lb')+text(160,203,'황금 테두리 = 관객이 고른 카드','lb m'))},
  {t:'세 줄로 나눠 깔기',x:'앞면이 보이게 왼쪽→가운데→오른쪽→다시 왼쪽… 순서로 한 장씩 놓아 7장짜리 세 줄을 만듭니다.',say:'"카드를 세 줄로 나눠 볼게요. 고른 카드가 어느 줄에 있는지만 알려 주세요."',
   svg:svg([40,138,236].map((x,i)=>pile(x,14,7,12,{hiIdx:i===1?3:-1})+text(x+22,128+6,'')).join('')+[40,138,236].map((x,i)=>text(x+22,180,`${i+1}번 줄`)).join('')+text(160,202,'카드는 7장씩 세 줄이 됩니다','lb m'))},
  {t:'고른 줄을 가운데 끼우기',x:'관객이 가리킨 줄을 집어, 다른 두 줄 사이에 끼워서 하나로 포갭니다. 세 줄 중 순서는 "다른 줄 → 고른 줄 → 다른 줄"이 됩니다. 이때 카드는 뒤집어 한 덱으로 모아요.',say:'"자, 이제 카드를 한데 모을게요."',
   svg:svg(pile(34,6,3,7)+pile(138,6,3,7,{all:true})+pile(242,6,3,7)+text(56,100,'다른 줄','lb m')+text(160,100,'고른 줄','lb')+text(264,100,'다른 줄','lb m')+arrow(160,108,160,128)+card(138,126,{})+card(138,134,{hi:true})+card(138,142,{})+text(220,155,'고른 줄이 가운데','lb','start')+text(220,172,'(7장씩 3덩이)','lb m','start'))},
  {t:'같은 과정 2번 더 반복',x:'모은 덱을 다시 세 줄로 깔고, 줄을 물어보고, 고른 줄을 가운데 끼워 모으기를 총 세 번 합니다. 매번 카드가 가운데로 모여요.',say:'"조금 더 집중해 볼게요… 잡음이 있네요. 한 번만 더요."',
   svg:svg(text(160,40,'깔기 → 묻기 → 가운데 끼우기','lb')+text(160,70,'총 3번 반복','lb')+[0,1,2].map(i=>card(75+i*70,92,{hi:i===2,face:`${i+1}회`})).join('')+arrow(124,123,142,123)+arrow(194,123,212,123)+text(160,190,'마지막 3회째가 끝나면 준비 완료!','lb m'))},
  {t:'위에서 11번째 카드가 정답!',x:'덱을 앞면이 아래로 놓고 한 장씩 위에서부터 세어, 11번째 카드를 뒤집습니다. 그게 관객이 고른 카드예요.',say:'"당신이 생각한 카드는… 바로 이 카드죠!"',
   svg:svg(Array.from({length:11},(_,i)=>10-i).map(i=>card(130,8+i*12,{hi:i===10})).join('')+text(100,28,'1','lb','end')+text(100,140,'11번째','lb','end')+arrow(104,138,126,138)+text(214,150,'← 이 카드!','lb','start'))}
 ]
},
{
 id:'key',title:'키 카드 읽기',level:'★★☆ 쉬움',time:'약 2분',
 desc:'덱의 맨 아래 카드를 몰래 기억해 두면, 관객이 뽑아 섞은 카드도 찾아낼 수 있는 기본 중의 기본 기술.',
 need:'카드 한 벌 (52장)',
 why:'관객 카드를 덱 맨 위에 올리고 컷하면, 몰래 기억한 맨 아래 카드(키 카드)가 바로 그 카드 앞에 붙게 돼요. 키 카드를 찾으면 다음 카드가 정답입니다.',
 tips:['덱을 정리하는 척하며 맨 아래 카드를 자연스럽게 슬쩍 보세요.','관객이 카드를 뽑을 때 덱을 계속 들고 있어야 키 카드가 맨 아래에 유지돼요.','카드를 찾을 때 "느낌이 오네요…" 하며 시간을 끌면 훨씬 마술 같아요.'],
 steps:[
  {t:'맨 아래 카드를 몰래 기억',x:'덱을 정리하는 척하며 맨 아래 카드를 슬쩍 확인하고 기억합니다. 이게 키 카드예요. 아래 그림에서는 ♠7입니다.',say:'(속으로) "맨 아래는 ♠7…"',
   svg:svg(pile(120,20,6,2.5)+card(120,35,{face:'♠7',hi:true,rot:-6,py:100})+text(220,56,'👁 슬쩍 확인','lb','start')+text(160,170,'맨 아래 카드 = 키 카드 (♠7)','lb')+text(160,192,'관객에게는 비밀!','lb m'))},
  {t:'관객이 아무 카드나 한 장 뽑기',x:'덱을 손에 든 채로 관객에게 아무 카드나 뽑게 하세요. 보고 기억하게 한 뒤 다른 사람에게 보여줘도 좋아요. 당신은 보지 않습니다.',say:'"아무 카드나 한 장 뽑아서 기억하세요. 저는 안 볼게요."',
   svg:svg(pile(36,30,6,2.5)+card(36,60,{})+card(186,24,{face:'♥Q',hi:true,rot:10})+arrow(110,90,178,66)+text(98,170,'덱은 계속 내 손에','lb')+text(224,126,'관객이 보고 기억','lb'))},
  {t:'뽑은 카드를 덱 맨 위에 올리기',x:'관객이 본 카드를 앞면 아래로 하여 덱의 맨 위에 올려 달라고 합니다. 이제 정답 카드는 맨 위, 키 카드는 맨 아래에 있어요.',say:'"카드를 이 덱 위에 올려 주세요."',
   svg:svg(pile(120,86,6,2.5)+card(120,28,{hi:true})+arrow(160,98,160,122)+text(52,48,'♥Q 맨 위','lb','start')+text(52,170,'♠7 맨 아래','lb','start')+text(160,200,'정답 카드: 맨 위 / 키 카드: 맨 아래','lb m'))},
  {t:'덱을 한 번 컷하기',x:'덱의 윗부분을 집어 테이블에 놓고, 아랫부분을 그 위에 올려 컷을 완성합니다. 이제 ♠7(키 카드) 바로 아래에 ♥Q가 붙었어요!',say:'"덱을 섞어서 카드를 완전히 숨길게요."',
   svg:svg(pile(40,14,5,6)+card(40,14,{hi:true})+text(62,126,'A (윗부분)','lb')+pile(222,14,5,6)+text(244,126,'B (아랫부분)','lb')+arrow(88,70,152,70)+arrow(152,70,210,70)+card(106,112,{face:'♠7'})+card(166,112,{face:'♥Q',hi:true})+arrow(152,143,164,143)+text(128,190,'키 카드','lb')+text(188,190,'정답','lb')+text(160,205,'컷 후: ♠7 바로 뒤에 ♥Q가 붙음','lb m'))},
  {t:'키 카드 뒤 카드를 뒤집기',x:'덱을 앞면이 보이게 한 장씩 넘기며 키 카드(♠7)를 찾고, 바로 다음 카드가 관객이 고른 카드입니다.',say:'"이 카드를 만지는 순간 손끝이 찌릿하네요… 혹시, 이 카드 아닌가요?"',
   svg:svg(card(20,60,{face:'♣3'})+card(70,60,{face:'♦9'})+card(120,60,{face:'♠7'})+text(142,52,'키 카드','lb')+card(170,60,{face:'♥Q',hi:true})+text(192,52,'정답!','lb')+card(220,60,{face:'♠2'})+arrow(150,150,185,130)+text(160,175,'키 카드 바로 다음 카드','lb'))}
 ]
}
];

/* ---------- 추가 마술용 도우미 ---------- */
const big=(x,y,t,sz=26,a='middle')=>`<text x="${x}" y="${y}" text-anchor="${a}" class="lb" style="font-size:${sz}px;font-weight:700">${t}</text>`;
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function die(x,y,n,s=44,hi){
  let g=`<rect x="${x}" y="${y}" width="${s}" height="${s}" rx="7" class="cf${hi?' hi':''}"/>`;
  PIPS[n].forEach(i=>{g+=`<circle cx="${x+s*(0.25+0.25*(i%3))}" cy="${y+s*(0.25+0.25*Math.floor(i/3))}" r="${s/13}" fill="#222"/>`});
  return g;
}
function numcard(x,y,nums,hi){
  let g=`<rect x="${x}" y="${y}" width="68" height="104" rx="6" class="cf${hi?' hi':''}"/>`;
  nums.forEach((n,i)=>{g+=`<text x="${x+(i%2?48:20)}" y="${y+22+Math.floor(i/2)*24}" text-anchor="middle" class="ct" style="font-size:${i===0?17:13}px${i===0?';fill:#7a3cff':''}">${n}</text>`});
  return g;
}
const NC={A:[1,3,5,7,9,11,13,15],B:[2,3,6,7,10,11,14,15],C:[4,5,6,7,12,13,14,15],D:[8,9,10,11,12,13,14,15]};
const dash=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" class="ar" style="stroke-width:2;stroke-dasharray:5 4"/>`;

TRICKS.push(
{
 id:'pairs',title:'빨강·검정 짝짓기',level:'★☆☆ 아주 쉬움',time:'약 2분',
 desc:'관객이 직접 섞은 카드인데도, 두 장씩 짝지으면 모든 짝이 빨강 하나 + 검정 하나가 돼요.',
 need:'카드 20장 (빨강 10장, 검정 10장)',
 why:'빨강·검정을 번갈아 쌓아 두고, 윗부분을 한 장씩 딜해 순서를 뒤집은 뒤 리플 셔플을 한 번 하면 카드가 항상 "빨강/검정 쌍"으로 섞여요. 이를 질버리스(Gilbreath) 원리라고 불러요.',
 tips:['처음 번갈아 쌓은 것을 들키지 않도록 "아무 카드나 20장 뽑았어요"라고 말하며 뒤집어 놓아요.','"컷"이 아니라 반드시 "한 장씩 딜"해야 해요. 이게 핵심이에요.','셔플은 한 번만 해요. 여러 번 섞으면 효과가 사라져요.','섞은 뒤에는 덱을 컷하지 말고 바로 짝을 펼치세요.'],
 steps:[
  {t:'빨강·검정을 번갈아 쌓기',x:'미리 빨강, 검정, 빨강, 검정… 순서로 20장을 번갈아 쌓아 둡니다(앞면이 아래인 덱). 관객에게는 보이지 않게 해요.',say:'"카드 20장을 준비했어요. 그냥 평범한 카드죠."',
   svg:svg(Array.from({length:8},(_,i)=>card(14+i*35,60,{face:i%2?'♠':'♥'})).join('')+text(160,35,'위에서부터 빨강·검정이 번갈아 (비밀!)','lb')+text(160,170,'앞면: ♥ ♠ ♥ ♠ ♥ ♠ …','lb m'))},

/* ---------- 추가 마술 2차 ---------- */
function flow(vals,labels,hiIdx=-1,y=60){
  const bw=62,gap=14,tot=vals.length*bw+(vals.length-1)*gap,x0=(320-tot)/2;let g='';
  vals.forEach((v,i)=>{const x=x0+i*(bw+gap);
    g+=`<rect x="${x}" y="${y}" width="${bw}" height="56" rx="8" class="cf${i===hiIdx?' hi':''}"/>`+big(x+bw/2,y+38,v,28)+text(x+bw/2,y+76,labels[i],'lb m');
    if(i)g+=arrow(x-gap+1,y+28,x-1,y+28);});
  return g;
}
const coin=(x,y)=>`<circle cx="${x}" cy="${y}" r="11" fill="#f2c94c" stroke="#a87b00" stroke-width="2"/>`;
function handBox(x,y,label,n){
  let g=`<rect x="${x}" y="${y}" width="110" height="90" rx="16" class="cf"/>`+text(x+55,y+110,label,'lb');
  for(let i=0;i<n;i++)g+=coin(x+(n===1?55:38+i*34),y+45);
  return g;
}

/* ---------- 앱 ---------- */
const app=document.getElementById('app');
let doneSet=new Set();
try{doneSet=new Set(JSON.parse(localStorage.getItem('magic-done')||'[]'))}catch(e){}
function saveDone(){try{localStorage.setItem('magic-done',JSON.stringify([...doneSet]))}catch(e){}}

const CAT={'21':'카드','key':'카드','pairs':'카드','ninth':'카드','1089':'숫자','five':'숫자','missing':'숫자','binary':'숫자','dice':'물건','hand':'물건'};
TRICKS.forEach(t=>{t.cat=CAT[t.id]||'기타';t.stars=(t.level.match(/★/g)||[]).length});
const LEVELS=[['all','전체 난이도'],['1','★ 아주 쉬움'],['2','★★ 쉬움']];
const CATS=['전체 종류','카드','숫자','물건'];
let filt={lv:'all',cat:'전체 종류'};
try{Object.assign(filt,JSON.parse(localStorage.getItem('magic-filter')||'{}'))}catch(e){}
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;const b=document.getElementById('install');if(b)b.hidden=false});

function home(){
  const chip=(grp,val,label,on)=>`<button class="chip${on?' on':''}" data-grp="${grp}" data-val="${val}">${label}</button>`;
  app.innerHTML=`<h1>🎩 쉬운 카드마술 배우기</h1><p class="sub">그림 보면서 따라 하는 5분 마술. 배우고 싶은 걸 골라 보세요.</p>
  <button class="b p" id="install" ${installEvt?'':'hidden'} style="width:100%;margin-bottom:12px">📲 홈 화면에 앱으로 설치</button>
  <div class="chips">${LEVELS.map(([v,l])=>chip('lv',v,l,filt.lv===v)).join('')}</div>
  <div class="chips">${CATS.map(c=>chip('cat',c,c,filt.cat===c)).join('')}</div>
  <div id="list"></div>
  <div class="foot"><a id="src">마술 자료 출처와 안내</a><p class="hint" id="ioshint"></p></div>`;
  const list=document.getElementById('list');
  function render(){
    const items=TRICKS.filter(t=>(filt.lv==='all'||t.stars===+filt.lv)&&(filt.cat==='전체 종류'||t.cat===filt.cat));
    list.innerHTML=items.length?items.map(t=>`<button class="tile" data-id="${t.id}"><h2>${t.title} ${doneSet.has(t.id)?'<span class="done">✓ 완료</span>':''}</h2><p>${t.desc}</p><span class="tag">${t.level}</span><span class="tag">${t.cat} 마술</span><span class="tag">⏱ ${t.time}</span><span class="tag">🎒 ${t.need}</span></button>`).join(''):'<p class="sub">조건에 맞는 마술이 없어요. 필터를 바꿔 보세요.</p>';
    list.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{location.hash='#/'+b.dataset.id});
  }
  app.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    filt[c.dataset.grp]=c.dataset.val;
    try{localStorage.setItem('magic-filter',JSON.stringify(filt))}catch(e){}
    app.querySelectorAll(`.chip[data-grp="${c.dataset.grp}"]`).forEach(x=>x.classList.toggle('on',x===c));
    render();
  });
  render();
  document.getElementById('install').onclick=async()=>{if(!installEvt)return;installEvt.prompt();await installEvt.userChoice;installEvt=null;document.getElementById('install').hidden=true};
  if(/iphone|ipad/i.test(navigator.userAgent)&&!navigator.standalone)document.getElementById('ioshint').textContent='아이폰: 공유 버튼 → "홈 화면에 추가"로 앱처럼 설치할 수 있어요.';
  document.getElementById('src').onclick=()=>{location.hash='#/about'};
}

function trick(id,n){
  const t=TRICKS.find(x=>x.id===id);if(!t)return home();
  const total=t.steps.length;
  if(n===undefined||n<0)n=0;
  if(n>total)n=total;
  if(n===total){ // 마무리 화면
    doneSet.add(id);saveDone();
    app.innerHTML=`<button class="back">← 목록으로</button><h1>${t.title} 완료 🎉</h1>
    <div class="box"><h3>왜 이게 되는 걸까요?</h3><p>${t.why}</p></div>
    <div class="box"><h3>실전 팁</h3><ul>${t.tips.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div class="nav"><button class="b" id="again">처음부터 다시</button><button class="b p" id="list">다른 마술 보기</button></div>`;
    app.querySelector('.back').onclick=()=>{location.hash='#/'};
    document.getElementById('again').onclick=()=>{location.hash='#/'+id+'/0'};
    document.getElementById('list').onclick=()=>{location.hash='#/'};
    return;
  }
  const s=t.steps[n];
  app.innerHTML=`<button class="back">← 목록으로</button><h1>${t.title}</h1><p class="sub">준비물: ${t.need}</p>
  <div class="dots">${t.steps.map((_,i)=>`<span class="dot${i===n?' on':''}"></span>`).join('')}</div>
  <div class="stage">${s.svg}</div>
  <div class="step"><h2>${n+1}. ${s.t}</h2><p>${s.x}</p><div class="say">${s.say}</div></div>
  <div class="nav"><button class="b" id="prev" ${n===0?'disabled':''}>이전</button><button class="b p" id="next">${n===total-1?'마무리':'다음'}</button></div>`;
  app.querySelector('.back').onclick=()=>{location.hash='#/'};
  document.getElementById('prev').onclick=()=>{location.hash=`#/${id}/${n-1}`};
  document.getElementById('next').onclick=()=>{location.hash=`#/${id}/${n+1}`};
}

function about(){
  app.innerHTML=`<button class="back">← 목록으로</button><h1>자료 출처와 안내</h1>
  <div class="box"><h3>어디서 마술 자료를 구하나요?</h3><ul>
  <li><b>저작권이 풀린 고전 마술서</b>: Hoffmann의 <i>Modern Magic</i>(1876), Erdnase의 <i>Expert at the Card Table</i>(1902) 등은 Project Gutenberg, Internet Archive에 공개돼 있어요.</li>
  <li><b>자동 마술(self-working)</b>: 21장 마술처럼 수학 원리로 되는 고전 마술은 수백 년 전부터 전해진 공용 지식이에요.</li>
  <li><b>직접 창작한 설명</b>: 이 앱의 그림과 글은 마술 방법만 참고하고 표현은 새로 만든 것입니다.</li></ul></div>
  <div class="box"><h3>주의할 점</h3><ul>
  <li>마술의 <b>방법 자체</b>는 보통 저작권으로 보호되지 않지만, 책·영상의 <b>글과 그림</b>은 보호돼요. 그대로 복사하지 말고 새로 쓰세요.</li>
  <li>특정 마술사가 만든 <b>최근 창작 마술</b>은 허락 없이 가져오지 않는 것이 마술계의 예의예요.</li>
  <li>마술은 <b>관객 앞에서 비밀을 지키는 것</b>이 매력이에요. 앱 설명에서도 "어떻게 해?"를 묻는 사람에게는 웃으며 비밀이라고 해 주세요.</li></ul></div>`;
  app.querySelector('.back').onclick=()=>{location.hash='#/'};
}

function route(){
  const p=location.hash.replace(/^#\/?/,'').split('/');
  if(!p[0])return home();
  if(p[0]==='about')return about();
  trick(p[0],p[1]!==undefined?parseInt(p[1],10):0);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
